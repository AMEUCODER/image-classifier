name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # headless build: no GUI libraries needed on the CI machine
      - run: pip install opencv-contrib-python-headless numpy pandas pytest scikit-image
      - run: python -m pytest -q
